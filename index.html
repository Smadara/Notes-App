<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="toolbar">
            <h1>My Notes <small id="counter"></small></h1>
            <div class="tools">
                <div class="search">
                    <i class="uil uil-search"></i>
                    <input type="text" id="search" placeholder="Search notes..." spellcheck="false">
                </div>
                <select id="sort" title="Sort">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>
                <button class="icon-btn" id="themeBtn" title="Toggle theme"><i class="uil uil-moon"></i></button>
                <button class="icon-btn" id="exportBtn" title="Export notes"><i class="uil uil-download-alt"></i></button>
                <input type="file" id="importFile" accept=".json" hidden>
            </div>
        </div>

        <div class="filters" id="filters"></div>

        <div class="wrapper">
            <li class="add-box">
                <div class="icon"><i class="uil uil-plus"></i></div>
                <p>Add new note</p>
            </li>
        </div>
        <p class="empty" id="empty" hidden>No notes found.</p>
    </div>

    <div class="popup-box">
        <div class="popup">
            <div class="content">
                <header>
                    <p></p>
                    <i class="uil uil-times"></i>
                </header>
                <form action="#">
                    <div class="row title">
                        <label for="title">Title</label>
                        <input type="text" id="title" spellcheck="false" maxlength="60">
                    </div>
                    <div class="row">
                        <label>Type</label>
                        <div class="types">
                            <button type="button" data-type="text" class="active">Text</button>
                            <button type="button" data-type="list">Checklist</button>
                        </div>
                    </div>
                    <div class="row description">
                        <label for="desc">Description</label>
                        <textarea id="desc" spellcheck="false"></textarea>
                    </div>
                    <div class="row">
                        <label for="tags">Tags</label>
                        <input type="text" id="tags" placeholder="work, study, Personal" spellcheck="false">
                    </div>
                    <div class="row">
                        <label>Color</label>
                        <div class="colors"></div>
                    </div>
                    <button id="saveBtn"></button>
                    <p class="hint" id="hint"></p>
                </form>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
